<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2D7FF9">
<title>小书包 · 出门前智能检查官</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="logo">🎒</div>
    <div>
      <div class="title">小书包</div>
      <div class="subtitle">出门前智能检查官</div>
    </div>
  </header>

  <main id="view-today" class="view active">
    <div class="today-head">
      <div class="day-big" id="today-day">周一</div>
      <div class="day-sub" id="today-date"></div>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-text" id="progress-text">0 / 0</div>
    </div>
    <div class="check-list" id="today-list"></div>
    <div class="empty-hint" id="today-empty" style="display:none"></div>
    <button class="big-btn" id="complete-btn">✅ 完成今日检查</button>
  </main>

  <main id="view-schedule" class="view">
    <div class="section-tip">设置每天上什么课、对应要带什么。一次设置，每天自动提醒。</div>
    <div class="schedule-list" id="schedule-list"></div>
  </main>

  <main id="view-items" class="view">
    <div class="add-row">
      <input id="new-item-name" placeholder="新增物品，如：科学书" maxlength="12">
      <button id="add-item-btn">➕ 添加</button>
    </div>
    <div class="item-grid" id="item-grid"></div>
  </main>

  <main id="view-achv" class="view">
    <div class="streak-card">
      <div class="streak-num" id="streak-num">0</div>
      <div class="streak-label">连续带齐天数 🔥</div>
    </div>
    <div class="stat-row">
      <div class="stat"><div class="stat-num" id="stat-total">0</div><span>总检查</span></div>
      <div class="stat"><div class="stat-num" id="stat-all">0</div><span>全带齐</span></div>
    </div>
    <div class="medal-title">勋章墙</div>
    <div class="medal-wall" id="medal-wall"></div>
  </main>

  <main id="view-settings" class="view">
    <div class="setting-row">
      <label>演示用：把「今天」设为</label>
      <select id="manual-today">
        <option value="">（按真实日期）</option>
        <option value="1">周一</option>
        <option value="2">周二</option>
        <option value="3">周三</option>
        <option value="4">周四</option>
        <option value="5">周五</option>
        <option value="6">周六</option>
        <option value="7">周日</option>
      </select>
    </div>
    <div class="setting-note">设置成某一天，可以演示「任意星期几的清单」效果。</div>
    <button class="danger-btn" id="clear-btn">🗑️ 清空所有数据</button>
    <div class="about">小书包 · 小智能创新行动参赛作品</div>
  </main>

  <nav class="tabbar">
    <button data-view="today" class="tab active"><span>📅</span><span>今日</span></button>
    <button data-view="schedule" class="tab"><span>🗓️</span><span>课表</span></button>
    <button data-view="items" class="tab"><span>📦</span><span>物品</span></button>
    <button data-view="achv" class="tab"><span>🏆</span><span>成就</span></button>
    <button data-view="settings" class="tab"><span>⚙️</span><span>设置</span></button>
  </nav>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-title" id="modal-title">添加课程</div>
    <input id="modal-input" placeholder="课程名，如：语文" maxlength="10">
    <div class="modal-items" id="modal-items"></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="ghost">取消</button>
      <button id="modal-ok" class="primary">确定</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="app.js?v=5766b65"></script>
</body>
</html>
